{# One reusable dialog + a toast area + hidden file pickers. static/js/ui/modal.js fills them in. #}
<dialog id="modal" class="modal">
  <form method="dialog" id="modal-form" class="modal__panel">
    <h2 id="modal-title" class="modal__title"></h2>
    <div id="modal-body" class="modal__body"></div>
    <div id="modal-actions" class="modal__actions"></div>
  </form>
</dialog>

<div id="toasts" class="toasts" aria-live="polite"></div>

<input id="file-xlsx" type="file" accept=".xlsx" hidden>
<input id="file-json" type="file" accept=".json,application/json" hidden>
